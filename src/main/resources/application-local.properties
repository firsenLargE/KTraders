# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kapiltradersdb
spring.datasource.username=zion
spring.datasource.password=zion
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hikari Performance
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Uploads configuration (Keep local paths)
# Base on-disk directory for uploads (relative to project root or absolute path)
app.upload.base-dir=data/uploads
# Thumbnail sizes
app.upload.thumbnail.width=400
app.upload.thumbnail.height=400

# enable H2 console for debugging (optional - might not work with Postgres driver in runtime scope for web console)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Server settings (same as default)
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.example.demo=INFO
logging.level.org.hibernate.SQL=DEBUG
