# Local profile using file-based H2 so single-click use is possible
spring.datasource.url=jdbc:h2:file:./data/kapiltraders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Uploads configuration
# Base on-disk directory for uploads (relative to project root or absolute path)
app.upload.base-dir=data/uploads
# Thumbnail sizes
app.upload.thumbnail.width=400
app.upload.thumbnail.height=400

# enable H2 console for debugging (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server settings (same as default)
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.example.demo=INFO
logging.level.org.hibernate.SQL=DEBUG
