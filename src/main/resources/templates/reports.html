<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Reports')}"></head>

<body>
  <div class="container-xxl py-4">
    <div th:replace="~{fragments :: navbar}"></div>

    <!-- Header -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="page-head">
          <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="bg-primary bg-opacity-10 text-primary rounded-3 p-2">
                <i class="bi bi-graph-up-arrow fs-4"></i>
              </div>
              <div>
                <h1 class="h4 mb-0 fw-bold">Analytics Reports</h1>
                <div class="text-secondary small">Comprehensive inventory and category insights</div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">
                <i class="bi bi-calendar3 me-1"></i> Real-time data
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI Row -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="bg-primary bg-opacity-10 p-3 rounded-pill">
              <i class="bi bi-box-seam fs-4 text-primary"></i>
            </div>
            <div>
              <div class="text-secondary small text-uppercase tracking-wider fw-bold">Total Products</div>
              <div class="h3 mb-0 fw-bold" id="kpiProducts">0</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="bg-success bg-opacity-10 p-3 rounded-pill">
              <i class="bi bi-layers fs-4 text-success"></i>
            </div>
            <div>
              <div class="text-secondary small text-uppercase tracking-wider fw-bold">In-Stock Units</div>
              <div class="h3 mb-0 fw-bold" id="kpiUnits">0</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="bg-warning bg-opacity-10 p-3 rounded-pill">
              <i class="bi bi-tag fs-4 text-warning"></i>
            </div>
            <div>
              <div class="text-secondary small text-uppercase tracking-wider fw-bold">Categories</div>
              <div class="h3 mb-0 fw-bold" id="kpiCats">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="row g-4">
      <!-- Products Quantity -->
      <div class="col-xl-8">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white border-0 pt-4 px-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
              <h5 class="mb-0 fw-bold">Products by Quantity</h5>
              <div class="d-flex gap-2 flex-wrap">
                <input id="searchBar" class="form-control form-control-sm bg-light border-0" style="width: 150px;"
                  placeholder="Filter..." />
                <div class="btn-group btn-group-sm shadow-sm">
                  <button class="btn btn-white border" id="sortByName" title="Sort A-Z"><i
                      class="bi bi-sort-alpha-down"></i></button>
                  <button class="btn btn-white border" id="sortByQty" title="Sort by Qty"><i
                      class="bi bi-sort-numeric-down-alt"></i></button>
                  <button class="btn btn-white border" id="resetBar" title="Reset"><i
                      class="bi bi-arrow-counterclockwise"></i></button>
                  <button class="btn btn-white border" id="downloadBar" title="Download"><i
                      class="bi bi-download"></i></button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body p-4">
            <div style="height: 400px; position: relative;">
              <canvas id="productChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Category Distribution -->
      <div class="col-xl-4">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white border-0 pt-4 px-4">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="mb-0 fw-bold">Categories</h5>
              <div class="btn-group btn-group-sm shadow-sm">
                <button class="btn btn-white border" id="toggleDonut" title="Donut View"><i
                    class="bi bi-circle-half"></i></button>
                <button class="btn btn-white border" id="downloadPie" title="Download"><i
                    class="bi bi-download"></i></button>
              </div>
            </div>
          </div>
          <div class="card-body p-4">
            <div style="height: 400px; position: relative;">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Thymeleaf Data -->
    <script th:inline="javascript">
      const productNames = /*[[${productNames}]]*/[];
      const productQuantities = /*[[${productQuantities}]]*/[];
      const categoryLabels = /*[[${categoryCounts.keySet()}]]*/[];
      const categoryValues = /*[[${categoryCounts.values()}]]*/[];
    </script>

    <script th:replace="~{fragments :: theme_script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      const fmt = n => (n ?? 0).toLocaleString('en-IN');
      const totals = {
        products: productNames.length,
        units: productQuantities.reduce((a, b) => a + b, 0),
        cats: categoryLabels.length
      };

      document.getElementById('kpiProducts').textContent = fmt(totals.products);
      document.getElementById('kpiUnits').textContent = fmt(totals.units);
      document.getElementById('kpiCats').textContent = fmt(totals.cats);

      // Gradient setup
      function getGradient(ctx, area) {
        const g = ctx.createLinearGradient(0, area.bottom, 0, area.top);
        g.addColorStop(0, 'rgba(13, 110, 253, 0.1)');
        g.addColorStop(1, 'rgba(13, 110, 253, 0.8)');
        return g;
      }

      // Bar Chart
      const barCtx = document.getElementById('productChart').getContext('2d');
      const productChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: [...productNames],
          datasets: [{
            label: 'Quantity',
            data: [...productQuantities],
            borderRadius: 6,
            backgroundColor: ctx => {
              const { chart, chartArea } = ctx;
              return chartArea ? getGradient(chart.ctx, chartArea) : '#0d6efd';
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, grid: { drawBorder: false } }, x: { grid: { display: false } } }
        }
      });

      // Pie Chart
      const pieCtx = document.getElementById('categoryChart').getContext('2d');
      const categoryChart = new Chart(pieCtx, {
        type: 'pie',
        data: {
          labels: [...categoryLabels],
          datasets: [{
            data: [...categoryValues],
            backgroundColor: ['#0d6efd', '#6610f2', '#6f42c1', '#d63384', '#dc3545', '#fd7e14', '#ffc107', '#198754', '#20c997', '#0dcaf0'],
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } }
        }
      });

      // Toolbar Actions
      document.getElementById('searchBar').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = productNames.map((n, i) => ({ n, v: productQuantities[i] }))
          .filter(x => x.n.toLowerCase().includes(q));
        productChart.data.labels = filtered.map(x => x.n);
        productChart.data.datasets[0].data = filtered.map(x => x.v);
        productChart.update();
      });

      document.getElementById('sortByName').addEventListener('click', () => {
        const pairs = productChart.data.labels.map((n, i) => ({ n, v: productChart.data.datasets[0].data[i] }))
          .sort((a, b) => a.n.localeCompare(b.n));
        productChart.data.labels = pairs.map(p => p.n);
        productChart.data.datasets[0].data = pairs.map(p => p.v);
        productChart.update();
      });

      document.getElementById('sortByQty').addEventListener('click', () => {
        const pairs = productChart.data.labels.map((n, i) => ({ n, v: productChart.data.datasets[0].data[i] }))
          .sort((a, b) => b.v - a.v);
        productChart.data.labels = pairs.map(p => p.n);
        productChart.data.datasets[0].data = pairs.map(p => p.v);
        productChart.update();
      });

      document.getElementById('resetBar').addEventListener('click', () => {
        productChart.data.labels = [...productNames];
        productChart.data.datasets[0].data = [...productQuantities];
        document.getElementById('searchBar').value = '';
        productChart.update();
      });

      document.getElementById('toggleDonut').addEventListener('click', () => {
        categoryChart.options.cutout = categoryChart.options.cutout === '50%' ? 0 : '50%';
        categoryChart.update();
      });

      const downloadChart = (chart, name) => {
        const link = document.createElement('a');
        link.href = chart.toBase64Image();
        link.download = name;
        link.click();
      };
      document.getElementById('downloadBar').addEventListener('click', () => downloadChart(productChart, 'inventory-chart.png'));
      document.getElementById('downloadPie').addEventListener('click', () => downloadChart(categoryChart, 'category-chart.png'));
    </script>
  </div>
</body>

</html>
