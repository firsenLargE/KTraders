<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Monthly Sales')}"></head>

<body>
  <div class="container-xxl py-4">
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body d-flex align-items-center justify-content-between p-4 flex-wrap gap-3">
        <div>
          <h4 class="mb-1 fw-bold" th:text="'Monthly Performance - ' + ${ym}">Monthly Sales</h4>
          <div class="text-secondary small">Analysis of daily sales and profit trends</div>
        </div>
        <div class="d-flex gap-2">
          <div class="stat-pill">
            <div class="small text-secondary">Total Revenue</div>
            <div class="fw-bold fs-5" th:text="'₹' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}">
              ₹0.00</div>
          </div>
          <div class="stat-pill border-start ps-3">
            <div class="small text-secondary">Monthly P/L</div>
            <div class="fw-bold fs-5" th:classappend="${totalPL >= 0 ? 'text-success' : 'text-danger'}"
              th:text="'₹' + ${#numbers.formatDecimal(totalPL, 1, 'COMMA', 2, 'POINT')}">₹0.00</div>
          </div>
          <a th:href="@{'/reports/sales/monthly.pdf'(year=${ym.year}, month=${ym.monthValue})}"
            class="btn btn-primary d-flex align-items-center">
            <i class="bi bi-file-earmark-pdf me-2"></i>PDF
          </a>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
            <tr>
              <th class="ps-4">Transaction Date</th>
              <th>Product Details</th>
              <th class="text-center">Qty</th>
              <th class="text-center">Result</th>
              <th class="text-end pe-4">Profit / Loss</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${rows}">
              <td class="ps-4 fw-medium text-dark" th:text="${r.date}">2026-01-01</td>
              <td>
                <div class="fw-semibold" th:text="${r.productName}">Product</div>
                <div class="text-secondary smaller"
                  th:text="'Rev: ₹' + ${#numbers.formatDecimal(r.totalRevenue, 1, 'COMMA', 2, 'POINT')}">Rev: ₹0.00
                </div>
              </td>
              <td class="text-center fw-medium" th:text="${r.qty}">0</td>
              <td class="text-center">
                <span th:if="${r.profitLossAmount >= 0}"
                  class="badge text-bg-success-subtle border border-success-subtle text-success rounded-pill px-3">
                  Profit
                </span>
                <span th:if="${r.profitLossAmount < 0}"
                  class="badge text-bg-danger-subtle border border-danger-subtle text-danger rounded-pill px-3">
                  Loss
                </span>
              </td>
              <td class="text-end pe-4 fw-bold"
                th:classappend="${r.profitLossAmount >= 0 ? 'text-success' : 'text-danger'}"
                th:text="'₹' + ${#numbers.formatDecimal(r.profitLossAmount, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
            </tr>
          </tbody>
          <tfoot class="bg-light-subtle border-top mt-2">
            <tr>
              <td colspan="2" class="ps-4 fw-bold py-3">MONTHLY CUMULATIVE</td>
              <td class="text-center fw-bold" th:text="${totalQty}">0</td>
              <td></td>
              <td class="text-end pe-4 fw-bold fs-5" th:classappend="${totalPL >= 0 ? 'text-success' : 'text-danger'}"
                th:text="'₹' + ${#numbers.formatDecimal(totalPL, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <style>
    .stat-pill {
      min-width: 140px;
    }

    .smaller {
      font-size: 0.75rem;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <div th:replace="~{fragments :: theme_script}"></div>
</body>

</html>
