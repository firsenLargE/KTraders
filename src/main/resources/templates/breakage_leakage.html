<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Breakage & Leakage')}"></head>

<body>
    <div class="container-xxl py-4">
        <div th:replace="~{fragments :: navbar}"></div>

        <!-- Stats Overview -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card border-0 h-100">
                    <div class="card-body p-4">
                        <div class="text-uppercase-header extra-small mb-2">Total Records</div>
                        <div class="h3 mb-0 fw-bold" th:text="${items != null ? items.size() : 0}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 h-100">
                    <div class="card-body p-4 text-danger">
                        <div class="text-uppercase-header extra-small mb-2 opacity-75">Breakage</div>
                        <div class="h3 mb-0 fw-bold"
                            th:text="${items != null ? items.?[reason == 'breakage'].size() : 0}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 h-100">
                    <div class="card-body p-4 text-info">
                        <div class="text-uppercase-header extra-small mb-2 opacity-75">Leakage</div>
                        <div class="h3 mb-0 fw-bold"
                            th:text="${items != null ? items.?[reason == 'leakage'].size() : 0}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 h-100 text-warning">
                    <div class="card-body p-4">
                        <div class="text-uppercase-header extra-small mb-2 opacity-75">Expiry</div>
                        <div class="h3 mb-0 fw-bold"
                            th:text="${items != null ? items.?[reason == 'expiry'].size() : 0}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Form Column -->
            <div class="col-lg-4">
                <div class="card border-0 sticky-top" style="top: 2rem;">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-4">New Incident Log</h6>
                        <form th:action="@{/inventory/breakage}" method="post" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Target Product ID</label>
                                <input type="number" name="product.id" class="form-control bg-light border-0 py-2"
                                    required min="1" placeholder="Enter product ID" />
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-7">
                                    <label class="form-label fw-semibold">Quantity</label>
                                    <input type="number" name="quantity" class="form-control bg-light border-0 py-2"
                                        required min="0.01" step="0.01" placeholder="0.00" />
                                </div>
                                <div class="col-5">
                                    <label class="form-label fw-semibold">Nature</label>
                                    <select name="reason" class="form-select bg-light border-0 py-2">
                                        <option value="breakage">Breakage</option>
                                        <option value="leakage">Leakage</option>
                                        <option value="expiry">Expiry</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Incident Details</label>
                                <textarea name="notes" class="form-control bg-light border-0 py-2" rows="3"
                                    placeholder="Brief description of the loss..."></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary rounded-pill py-2">
                                    <i class="bi bi-plus-lg me-2"></i> Log Loss
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- List Column -->
            <div class="col-lg-8">
                <div class="card border-0 overflow-hidden mb-4">
                    <div class="card-header bg-white border-0 py-4 px-4 overflow-hidden">
                        <h6 class="mb-0 fw-bold">Incident Log History</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light bg-opacity-50">
                                <tr>
                                    <th class="ps-4 py-3 text-uppercase-header">Timestamp</th>
                                    <th class="py-3 text-uppercase-header">Product</th>
                                    <th class="py-3 text-uppercase-header text-center">Qty</th>
                                    <th class="py-3 text-uppercase-header text-center">Reason</th>
                                    <th class="pe-4 py-3 text-uppercase-header">Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${items}">
                                    <td class="ps-4">
                                        <div class="fw-semibold small"
                                            th:text="${#temporals.format(b.occurredAt, 'dd MMM, HH:mm')}"></div>
                                    </td>
                                    <td>
                                        <div class="fw-bold product-name text-uppercase" th:text="${b.product.name}">
                                        </div>
                                        <div class="extra-small text-secondary opacity-50"
                                            th:text="'ID: ' + ${b.product.id}"></div>
                                    </td>
                                    <td class="text-center">
                                        <span
                                            class="badge bg-light text-dark rounded-pill border fw-bold px-3">[[${b.quantity}]]</span>
                                    </td>
                                    <td class="text-center">
                                        <span th:switch="${b.reason}">
                                            <span th:case="'breakage'"
                                                class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-3 py-1 extra-small">BREAKAGE</span>
                                            <span th:case="'leakage'"
                                                class="badge bg-info bg-opacity-10 text-info rounded-pill px-3 py-1 extra-small">LEAKAGE</span>
                                            <span th:case="'expiry'"
                                                class="badge bg-warning bg-opacity-10 text-warning rounded-pill px-3 py-1 extra-small">EXPIRY</span>
                                            <span th:case="*"
                                                class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-3 py-1 extra-small"
                                                th:text="${#strings.toUpperCase(b.reason)}">OTHER</span>
                                        </span>
                                    </td>
                                    <td class="pe-4">
                                        <div class="extra-small text-secondary opacity-75 italic"
                                            th:text="${b.notes} ?: '—'"></div>
                                    </td>
                                </tr>
                                <tr th:if="${items == null or items.isEmpty()}">
                                    <td colspan="5" class="py-5 text-center">
                                        <i class="bi bi-shield-exclamation fs-1 opacity-25 d-block mb-3"></i>
                                        <h5 class="fw-bold">No Records Logged</h5>
                                        <p class="text-secondary small">Loss incidents will appear here once recorded.
                                        </p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments :: theme_script}"></div>
</body>

</html>
