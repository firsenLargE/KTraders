<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Product Details')}"></head>

<body>
    <div class="container-xxl py-4">
        <div th:replace="~{fragments :: navbar}"></div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="page-head d-flex align-items-center gap-3">
                    <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                    <h1 class="h4 mb-0 fw-bold">Product Details</h1>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Image Column -->
            <div class="col-lg-5">
                <div class="card border-0 h-100 overflow-hidden">
                    <div class="position-relative" style="aspect-ratio: 1/1; background: var(--bg-soft);">
                        <img th:if="${product.imagePath}" th:src="@{${product.imagePath}}"
                            class="w-100 h-100 object-fit-contain p-4" alt="Product Image" />
                        <div th:if="${product.imagePath == null}"
                            class="w-100 h-100 d-grid place-items-center text-secondary">
                            <div class="text-center">
                                <i class="bi bi-image fs-1 opacity-25"></i>
                                <div class="fw-bold mt-2">No Image Available</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Info Column -->
            <div class="col-lg-7">
                <div class="card border-0 h-100">
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <h2 class="display-6 fw-bold product-name mb-0" th:text="${product.name}">Product Name</h2>
                            <p class="text-secondary small">Product ID: <span th:text="${product.id}">0</span></p>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-sm-6">
                                <div class="p-3 bg-light rounded-4 border-0">
                                    <div class="text-uppercase-header mb-1">Selling Price</div>
                                    <div class="stat-number text-primary mb-0"
                                        th:text="'₹' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">
                                        ₹0.00</div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="p-3 bg-light rounded-4 border-0">
                                    <div class="text-uppercase-header mb-1">Cost Price</div>
                                    <div class="stat-number text-secondary mb-0"
                                        th:text="'₹' + ${#numbers.formatDecimal(product.actualPrice ?: 0, 0, 'COMMA', 2, 'POINT')}">
                                        ₹0.00
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="list-group list-group-flush mb-4">
                            <div class="list-group-item bg-transparent px-0 d-flex justify-content-between">
                                <span class="text-secondary">Size / Description</span>
                                <span class="fw-semibold text-uppercase" th:text="${product.size ?: '—'}">—</span>
                            </div>
                            <div class="list-group-item bg-transparent px-0 d-flex justify-content-between">
                                <span class="text-secondary">Stock Quantity</span>
                                <span
                                    th:class="${product.quantity < 10 ? 'fw-bold text-danger' : 'fw-bold text-success'}"
                                    th:text="${product.quantity ?: 0}">0</span>
                            </div>
                            <div class="list-group-item bg-transparent px-0 d-flex justify-content-between">
                                <span class="text-secondary">Added Date</span>
                                <span class="fw-medium" th:text="${product.date}">2026-01-01</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:href="@{/edit-product/{id}(id=${product.id})}"
                                class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-pencil-square me-2"></i> Edit Product
                            </a>
                            <a th:href="@{/delete-product/{id}(id=${product.id})}"
                                class="btn btn-outline-danger rounded-pill px-4"
                                onclick="return confirm('Delete this product?')">
                                <i class="bi bi-trash me-2"></i> Delete
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: theme_script}"></div>
</body>

</html>
