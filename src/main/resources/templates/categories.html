<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Categories')}"></head>

<body>
    <div class="container-xxl py-4">
        <div th:replace="~{fragments :: navbar}"></div>

        <!-- Header -->
        <div class="row mb-5">
            <div class="col-12">
                <div class="page-head">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-primary bg-opacity-10 text-primary rounded-3 p-2">
                                <i class="bi bi-tags-fill fs-4"></i>
                            </div>
                            <div>
                                <h1 class="h4 mb-0 fw-bold">Classification Explorer</h1>
                                <div class="text-secondary small">Browse and manage inventory groups</div>
                            </div>
                        </div>
                        <div>
                            <span class="badge bg-light text-dark border px-3 py-2 rounded-pill small">
                                <span th:text="${categories != null ? categories.size() : 0}">0</span> Active Segments
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Category Grid -->
        <div class="row g-4">
            <div class="col-md-4 col-lg-3" th:each="cat : ${categories}">
                <div class="card border-0 h-100 shadow-soft-hover transition-base overflow-hidden p-1">
                    <div class="card-body text-center p-4">
                        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4"
                            style="width: 72px; height: 72px; border: 4px solid rgba(var(--bs-primary-rgb), 0.05);">
                            <i class="bi bi-folder2-open fs-2 text-primary opacity-75"></i>
                        </div>
                        <h5 class="fw-bold text-uppercase mb-1" th:text="${cat.name}">Category Name</h5>
                        <div class="extra-small text-secondary mb-3">
                            <i class="bi bi-box-seam me-1"></i>
                            <span th:text="${cat.count}">0</span>
                            <span th:text="${cat.count == 1} ? 'Product' : 'Products'">Products</span>
                        </div>
                        <div class="d-grid">
                            <a th:href="@{/search-products(query=${cat.name})}"
                                class="btn btn-outline-primary btn-sm rounded-pill py-2">
                                Browse Inventory <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${categories == null or categories.isEmpty()}" class="col-12 text-center py-5">
                <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-4"
                    style="width: 100px; height: 100px;">
                    <i class="bi bi-tag fs-1 opacity-25"></i>
                </div>
                <h5 class="fw-bold">No active categories detected</h5>
                <p class="text-secondary small">Try adding products with category tags to see them here.</p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: theme_script}"></div>
</body>

</html>
