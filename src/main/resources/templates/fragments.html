<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="common_head(title)">
    <meta charset="UTF-8">
    <title th:text="${title + ' • Kapil Traders'}">Kapil Traders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/base.css(v='1.1')}" rel="stylesheet">
    <link href="https://unpkg.com/slim-select@latest/dist/slimselect.css" rel="stylesheet">
    <script src="https://unpkg.com/slim-select@latest/dist/slimselect.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div th:fragment="navbar" class="page-head mb-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div class="brand d-flex align-items-center gap-2">
                <a th:href="@{/dashboard}" class="text-decoration-none d-flex align-items-center gap-2">
                    <div class="logo-container" style="width: 38px; height: 38px; position: relative;">
                        <img th:src="@{/images/logo.png}" id="customLogo"
                            style="width: 100%; height: 100%; object-fit: contain; display: block;"
                            onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='grid';">
                        <div id="fallbackLogo" class="logo"
                            style="width: 100%; height: 100%; border-radius: 10px; display: none; place-items: center; background: var(--brand-gradient); color: #fff; font-weight: 800; font-size: 1.2rem;">
                            K
                        </div>
                    </div>
                </a>
                <div>
                    <div class="fw-bold h5 mb-0" style="letter-spacing: -0.01em; font-family: 'Outfit', sans-serif;">
                        Kapil Traders</div>
                    <div class="small opacity-50">
                        <span sec:authorize="isAuthenticated()">
                            <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name"
                                class="fw-medium font-monospace extra-small">User</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <nav class="d-none d-md-flex align-items-center me-3 border-end pe-3 opacity-75">
                    <a th:href="@{/dashboard}" class="nav-link px-3 py-2 small fw-semibold"
                        th:classappend="${currentUri == '/dashboard' ? 'active text-primary' : ''}">Dashboard</a>
                    <a th:href="@{/products}" class="nav-link px-3 py-2 small fw-semibold"
                        th:classappend="${currentUri != null && currentUri.startsWith('/products') ? 'active text-primary' : ''}">Products</a>
                    <a th:href="@{/customers}" class="nav-link px-3 py-2 small fw-semibold"
                        th:classappend="${currentUri != null && currentUri.startsWith('/customers') ? 'active text-primary' : ''}">Customers</a>
                    <a th:href="@{/reports}" class="nav-link px-3 py-2 small fw-semibold"
                        th:classappend="${currentUri != null && currentUri.startsWith('/reports') ? 'active text-primary' : ''}">Analytics</a>
                    <a th:href="@{/purchases}" class="nav-link px-3 py-2 small fw-semibold"
                        th:classappend="${currentUri != null && currentUri.startsWith('/purchases') ? 'active text-primary' : ''}">Purchase</a>
                </nav>
                <div class="hstack gap-2">
                    <a th:href="@{/sales}" class="btn btn-primary btn-sm px-3 rounded-pill">
                        <i class="bi bi-lightning-charge-fill me-1"></i>Sale</a>
                    <a th:href="@{/logout}" class="btn btn-light btn-sm rounded-pill px-3 border" title="Logout">
                        <i class="bi bi-power"></i></a>
                    <button id="themeToggle" class="btn btn-light btn-sm rounded-pill border" title="Toggle theme">
                        <i class="bi bi-moon-stars" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Global Toast Container -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
            <div id="globalToast" class="toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive"
                aria-atomic="true">
                <div class="d-flex p-2">
                    <div class="toast-body fw-medium" id="toastMessage"></div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="theme_script">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            (function initTheme() {
                const saved = localStorage.getItem('kapil.theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', saved);
                const icon = document.getElementById('themeIcon');
                if (icon) icon.className = saved === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
            })();

            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const cur = document.documentElement.getAttribute('data-bs-theme') || 'light';
                    const next = cur === 'light' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-bs-theme', next);
                    localStorage.setItem('kapil.theme', next);
                    const icon = document.getElementById('themeIcon');
                    if (icon) icon.className = next === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
                });
            }
            window.showToast = function (msg, type = 'primary') {
                const el = document.getElementById('globalToast');
                const msgEl = document.getElementById('toastMessage');
                if (!el || !msgEl) return;

                el.className = `toast align-items-center border-0 shadow-lg text-white bg-${type}`;
                msgEl.textContent = msg;
                bootstrap.Toast.getOrCreateInstance(el).show();
            };
        </script>
    </div>
</body>

</html>
