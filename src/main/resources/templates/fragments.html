<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="common_head(title)">
    <meta charset="UTF-8">
    <title th:text="${title + ' • Kapil Traders'}">Kapil Traders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/base.css}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div th:fragment="navbar" class="page-head mb-4">
        <div class="d-flex align-items-center justify-content-between">
            <div class="brand d-flex align-items-center gap-2">
                <a th:href="@{/dashboard}" class="text-decoration-none d-flex align-items-center gap-2">
                    <div class="logo-container" style="width: 34px; height: 34px; position: relative;">
                        <img th:src="@{/images/logo.png}" id="customLogo"
                            style="width: 100%; height: 100%; object-fit: contain; display: block;"
                            onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='grid';">
                        <div id="fallbackLogo" class="logo"
                            style="width: 100%; height: 100%; border-radius: 8px; display: none; place-items: center; background: linear-gradient(135deg, #0d6efd, #6ea8fe); color: #fff; font-weight: 700;">
                            K
                        </div>
                    </div>
                </a>
                <div>
                    <div class="fw-semibold">Kapil Traders</div>
                    <div class="small text-secondary">
                        <span th:if="${session.validuser != null}">Welcome <span
                                th:text="${session.validuser.uname}">User</span></span>
                    </div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-speedometer me-1"></i>Dashboard</a>
                <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-box-seam me-1"></i>Products</a>
                <a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-graph-up me-1"></i>Reports</a>
                <a th:href="@{/sales}" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-receipt me-1"></i>Sales</a>
                <a th:href="@{/purchases}" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-cart-plus me-1"></i>Purchases</a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm"><i
                        class="bi bi-box-arrow-right me-1"></i>Logout</a>
                <button id="themeToggle" class="btn btn-outline-secondary btn-sm" title="Toggle theme">
                    <i class="bi bi-moon-stars" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </div>

    <div th:fragment="theme_script">
        <script>
            (function initTheme() {
                const saved = localStorage.getItem('kapil.theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', saved);
                const icon = document.getElementById('themeIcon');
                if (icon) icon.className = saved === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
            })();

            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const cur = document.documentElement.getAttribute('data-bs-theme') || 'light';
                    const next = cur === 'light' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-bs-theme', next);
                    localStorage.setItem('kapil.theme', next);
                    const icon = document.getElementById('themeIcon');
                    if (icon) icon.className = next === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
                });
            }
        </script>
    </div>
</body>

</html>
