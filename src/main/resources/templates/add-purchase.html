<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Add Purchase')}"></head>

<body>
    <div class="container-xxl py-4">
        <div th:replace="~{fragments :: navbar}"></div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 mb-4 h-100">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="bg-primary bg-opacity-10 text-primary rounded-4 d-flex align-items-center justify-content-center"
                                style="width: 48px; height: 48px;">
                                <i class="bi bi-cart-plus fs-4"></i>
                            </div>
                            <div>
                                <h4 class="fw-bold mb-0">Add New Purchase</h4>
                                <p class="text-secondary small mb-0">Record a new stock acquisition from a supplier</p>
                            </div>
                        </div>

                        <form th:action="@{/purchases/add}" th:object="${purchase}" method="post"
                            class="needs-validation" novalidate>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Target Product</label>
                                    <select id="productSelect" th:field="*{product.id}"
                                        class="form-select border-0 bg-light py-2" required>
                                        <option value="">Search across inventory...</option>
                                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Supplier Name</label>
                                    <input type="text" th:field="*{supplier}"
                                        class="form-control border-0 bg-light py-2"
                                        placeholder="Enter company or merchant name" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Volume (Quantity)</label>
                                    <input type="number" id="quantity" th:field="*{quantity}"
                                        class="form-control border-0 bg-light py-2" placeholder="0" min="1" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Acquisition Date</label>
                                    <input type="date" th:field="*{purchaseDate}"
                                        class="form-control border-0 bg-light py-2" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Unit Cost (₹)</label>
                                    <input type="number" id="unitCost" th:field="*{unitCost}"
                                        class="form-control border-0 bg-light py-2" placeholder="0.00" step="0.01"
                                        min="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Total Commitment (₹)</label>
                                    <input type="number" id="totalCost" th:field="*{totalCost}"
                                        class="form-control border-0 bg-light py-2"
                                        placeholder="Calculated automatically" step="0.01" readonly>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Settlement Method</label>
                                    <select th:field="*{paymentMethod}" class="form-select border-0 bg-light py-2"
                                        required>
                                        <option value="">Select Method</option>
                                        <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="${m}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Invoice Number</label>
                                    <input type="text" th:field="*{invoiceNumber}"
                                        class="form-control border-0 bg-light py-2"
                                        placeholder="Optional: e.g. INV/2024/001">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Additional Context (Notes)</label>
                                <textarea th:field="*{notes}" class="form-control border-0 bg-light py-2" rows="3"
                                    placeholder="Log any shipping details or quality checks..."></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary rounded-pill px-4 py-2">
                                    <i class="bi bi-check-circle me-2"></i> Confirm Purchase
                                </button>
                                <a th:href="@{/purchases}" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: theme_script}"></div>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            new SlimSelect({ select: '#productSelect' });

            const quantityInput = document.getElementById('quantity');
            const unitCostInput = document.getElementById('unitCost');
            const totalCostInput = document.getElementById('totalCost');

            function calculateTotal() {
                const q = parseFloat(quantityInput.value) || 0;
                const u = parseFloat(unitCostInput.value) || 0;
                totalCostInput.value = (q * u).toFixed(2);
            }

            quantityInput.addEventListener('input', calculateTotal);
            unitCostInput.addEventListener('input', calculateTotal);
        });
    </script>
</body>

</html>
