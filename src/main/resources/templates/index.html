<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Kapil Traders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 100%);
    }

    .login-container {
      max-width: 1000px;
      width: 100%;
      margin: 2rem;
    }

    .brand-side {
      background: var(--brand-gradient);
      border-radius: 32px 0 0 32px;
      padding: 4rem;
      position: relative;
      overflow: hidden;
    }

    .brand-side::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      filter: blur(60px);
    }

    .brand-side::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(59, 130, 246, 0.2);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      filter: blur(40px);
    }

    .form-side {
      background: #fff;
      border-radius: 0 32px 32px 0;
      padding: 4rem;
    }

    .input-field {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-field i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .input-field input {
      padding-left: 3rem !important;
    }

    @media (max-width: 991px) {

      .brand-side,
      .form-side {
        border-radius: 20px !important;
      }

      .brand-side {
        padding: 3rem;
      }

      .form-side {
        padding: 3rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container animate-up stagger-1">
    <div class="card border-0 overflow-hidden" style="border-radius: 32px;">
      <div class="row g-0">
        <div class="col-lg-5 brand-side d-flex flex-column justify-content-center text-white">
          <div class="animate-up stagger-2">
            <div class="glass d-inline-flex p-3 rounded-4 mb-4">
              <i class="bi bi-shop fs-1"></i>
            </div>
            <h1 class="display-5 fw-bold mb-3">Kapil Traders</h1>
            <p class="fs-5 opacity-75 mb-0">Experience the future of intelligent inventory management.</p>
          </div>
          <div class="mt-auto pt-5 animate-up stagger-4 opacity-50 small font-monospace">
            v2.4.0 — Premium Edition
          </div>
        </div>
        <div class="col-lg-7 form-side">
          <div class="animate-up stagger-3">
            <h2 class="fw-bold h3 mb-2">Welcome Back</h2>
            <p class="text-secondary mb-5">Identify yourself to access the command center.</p>

            <div th:if="${param.error}"
              class="alert alert-danger border-0 small rounded-3 bg-danger bg-opacity-10 text-danger mb-4 d-flex align-items-center gap-2">
              <i class="bi bi-exclamation-circle"></i>
              <span>Invalid email or password. Please try again.</span>
            </div>
            <div th:if="${param.logout}"
              class="alert alert-success border-0 small rounded-3 bg-success bg-opacity-10 text-success mb-4 d-flex align-items-center gap-2">
              <i class="bi bi-check-circle"></i>
              <span>You have been securely logged out.</span>
            </div>

            <form th:action="@{/login}" method="post">
              <div class="input-field">
                <i class="bi bi-envelope"></i>
                <input type="email" name="email" class="form-control bg-light border-0 py-3" placeholder="Email Address"
                  required>
              </div>
              <div class="input-field mb-4">
                <i class="bi bi-key"></i>
                <input type="password" name="password" class="form-control bg-light border-0 py-3"
                  placeholder="Secret Password" required>
              </div>

              <div class="d-grid gap-3">
                <button type="submit" class="btn btn-primary py-3">
                  Open Dashboard <i class="bi bi-arrow-right ms-2"></i>
                </button>
                <div class="text-center pt-2">
                  <span class="text-secondary small">New strategy?</span>
                  <a th:href="@{/signup}" class="text-primary fw-bold small text-decoration-none ms-1">Initialize
                    Account</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
