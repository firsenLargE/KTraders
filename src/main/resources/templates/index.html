<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Kapil Traders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --kt-primary: #2563eb;
      --kt-primary-dark: #1e40af;
      --kt-accent: #3b82f6;
      --kt-bg: #f8fafc;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--kt-bg);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: row;
    }

    .brand-side {
      background: linear-gradient(135deg, var(--kt-primary-dark) 0%, var(--kt-primary) 100%);
      color: #fff;
      padding: 3rem;
      width: 45%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .brand-side::after {
      content: '';
      position: absolute;
      bottom: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      filter: blur(40px);
    }

    .form-side {
      padding: 3.5rem;
      width: 55%;
    }

    .form-control {
      border: 1px solid #e2e8f0;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background-color: #f8fafc;
    }

    .form-control:focus {
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      border-color: var(--kt-primary);
      background-color: #fff;
    }

    .btn-primary {
      background: var(--kt-primary);
      border: none;
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: var(--kt-primary-dark);
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      .login-wrap {
        flex-direction: column;
        margin: 1rem;
        border-radius: 16px;
      }

      .brand-side {
        width: 100%;
        padding: 2rem;
        text-align: center;
      }

      .form-side {
        width: 100%;
        padding: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-wrap">
    <div class="brand-side">
      <div class="mb-4">
        <div class="bg-white bg-opacity-20 d-inline-flex p-3 rounded-4 mb-3">
          <i class="bi bi-shop fs-1"></i>
        </div>
        <h1 class="h2 fw-bold mb-2">Kapil Traders</h1>
        <p class="opacity-75 mb-0">The bliss of smart trading and inventory management.</p>
      </div>
      <div class="mt-auto small opacity-50">
        &copy; 2024 Kapil Traders. All rights reserved.
      </div>
    </div>
    <div class="form-side">
      <h2 class="fw-bold mb-1">Welcome Back</h2>
      <p class="text-secondary small mb-4">Please enter your credentials to continue.</p>

      <div th:if="${error}"
        class="alert alert-danger border-0 small text-center rounded-3 bg-danger bg-opacity-10 text-danger mb-4"
        th:text="${error}"></div>
      <div th:if="${success}"
        class="alert alert-success border-0 small text-center rounded-3 bg-success bg-opacity-10 text-success mb-4"
        th:text="${success}"></div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label small fw-bold text-uppercase text-secondary">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="name@company.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold text-uppercase text-secondary">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Sign In</button>
          <a th:href="@{/signup}" class="btn btn-link link-secondary small text-decoration-none">Don't have an account?
            <span class="text-primary fw-bold">Sign up</span></a>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
