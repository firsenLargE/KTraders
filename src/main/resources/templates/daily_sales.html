<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: common_head('Daily Sales')}"></head>

<body>
  <div class="container-xxl py-4">
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body d-flex align-items-center justify-content-between p-4">
        <div>
          <h4 class="mb-1 fw-bold" th:text="'Daily Sales Report - ' + ${date}">Daily Sales</h4>
          <div class="text-secondary small">Summary of transactions for the selected day</div>
        </div>
        <a th:href="@{'/reports/sales/daily.pdf'(date=${date})}" class="btn btn-primary">
          <i class="bi bi-file-earmark-pdf me-2"></i>Download PDF
        </a>
      </div>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
            <tr>
              <th class="ps-4">Product Name</th>
              <th class="text-center">Qty</th>
              <th class="text-center">Profit / Loss</th>
              <th class="text-end pe-4">P/L Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${rows}">
              <td class="ps-4">
                <div class="fw-semibold text-dark" th:text="${r.productName}">Product Name</div>
                <div class="text-secondary smaller" th:text="${r.date}">2026-01-30</div>
              </td>
              <td class="text-center fw-medium" th:text="${r.qty}">0</td>
              <td class="text-center">
                <span th:if="${r.profitLossAmount >= 0}"
                  class="badge text-bg-success-subtle border border-success-subtle text-success">
                  <i class="bi bi-graph-up-arrow me-1"></i>Profit
                </span>
                <span th:if="${r.profitLossAmount < 0}"
                  class="badge text-bg-danger-subtle border border-danger-subtle text-danger">
                  <i class="bi bi-graph-down-arrow me-1"></i>Loss
                </span>
              </td>
              <td class="text-end pe-4 fw-bold"
                th:classappend="${r.profitLossAmount >= 0 ? 'text-success' : 'text-danger'}"
                th:text="'₹' + ${#numbers.formatDecimal(r.profitLossAmount, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
            </tr>
          </tbody>
          <tfoot class="bg-light-subtle border-top">
            <tr>
              <td class="ps-4 fw-bold">TOTAL FOR DAY</td>
              <td class="text-center fw-bold" th:text="${totalQty}">0</td>
              <td></td>
              <td class="text-end pe-4 fw-bold fs-5" th:classappend="${totalPL >= 0 ? 'text-success' : 'text-danger'}"
                th:text="'₹' + ${#numbers.formatDecimal(totalPL, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <div th:replace="~{fragments :: theme_script}"></div>
</body>

</html>
